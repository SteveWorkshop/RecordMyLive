plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'rachel.materialapps.recordmylive'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "rachel.materialapps.recordmylive"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures{
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        //coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    implementation libs.lifecycle.extensions1
    implementation libs.legacy.support.v4
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //coreLibraryDesugaring libs.desugar.jdk.libs
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler


    implementation libs.gson


    //implementation libs.calendar.view

    implementation "com.kizitonwose.calendar:view:2.7.0"
    implementation "com.kizitonwose.calendar:core:2.7.0"

}